  /* Couleurs KOVE : turquoise du logo #2DBEC4. --brand sert aux aplats (boutons, filets),
     --accent au texte turquoise, assombri en thème clair pour rester lisible sur blanc. */
  :root{
    --brand:#2dbec4; --brand-ink:#05282a;
    --ink:#14191b; --paper:#eef1f1; --surface:#ffffff; --line:#d5dcdd; --line-strong:#b9c3c4;
    --muted:#525c5e; --accent:#00707a; --accent-dim:#d7f1f2;
    --danger:#b3261e; --bad-bg:#f8dfdd;
    --amber:#7f4f00; --amber-bg:#f6e8d2; --good:#276b45; --good-bg:#dcefe2;
    --on-photo:#ffffff; --on-photo-muted:#d3dcdd; --glass:rgba(10,16,18,.55); --glass-line:rgba(255,255,255,.18);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#edf2f2; --paper:#14161a; --surface:#1b2024; --line:#2a3238; --line-strong:#3a454c;
      --muted:#9eaaad; --accent:#2dbec4; --accent-dim:#11302f;
      --danger:#ff7a72; --bad-bg:#3a1f1f;
      --amber:#e0a53c; --amber-bg:#3a2f16; --good:#5fcf93; --good-bg:#173328;
    }
  }
  :root[data-theme="dark"]{
    --ink:#edf2f2; --paper:#14161a; --surface:#1b2024; --line:#2a3238; --line-strong:#3a454c;
    --muted:#9eaaad; --accent:#2dbec4; --accent-dim:#11302f;
    --danger:#ff7a72; --bad-bg:#3a1f1f;
    --amber:#e0a53c; --amber-bg:#3a2f16; --good:#5fcf93; --good-bg:#173328;
  }

  *{box-sizing:border-box;}
  /* Fond sombre sous la photo : le texte blanc posé dessus reste lisible même si l'image ne charge pas. */
  body{background:#1d1a17; color:var(--ink); font-family:'Work Sans',system-ui,sans-serif; padding-inline:16px; margin:0; min-height:100vh; position:relative;}
  /* Photo de fond : fixe, assombrie pour que le texte posé dessus reste lisible, fondue dans le fond de page en bas. */
  body::before{content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(180deg, rgba(8,13,15,.50) 0%, rgba(8,13,15,.42) 30%, rgba(8,13,15,.66) 62%, rgba(8,13,15,.90) 100%),
      url('assets/fond-rallye.webp') center 30% / cover no-repeat, #2a2420;}
  h1,h2,h3,.display{font-family:'Rajdhani',system-ui,sans-serif; font-weight:700; letter-spacing:.01em; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  #app{max-width:780px; margin:0 auto; padding-block:0 60px;}

  /* En-tête posé sur la photo */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:18px 14px; margin-bottom:22px; flex-wrap:wrap; border-bottom:1px solid var(--glass-line); color:var(--on-photo);}
  .brand{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .brand .logo{height:38px; width:auto; display:block;}
  .brand .titles{display:flex; flex-direction:column; line-height:1.05; padding-left:14px; border-left:2px solid var(--brand);}
  .brand .mark{font-family:'Rajdhani'; font-weight:700; font-size:1.25rem; letter-spacing:.06em;}
  .brand .sub{font-size:.7rem; color:var(--on-photo-muted); text-transform:uppercase; letter-spacing:.12em;}
  .ticket-badge{font-family:'IBM Plex Mono'; font-size:.78rem; background:var(--brand); color:var(--brand-ink); padding:5px 12px; border-radius:999px; font-weight:600;}

  .banner{background:var(--glass); color:var(--on-photo-muted); border:1px solid var(--glass-line); border-left:3px solid #e0a53c; border-radius:var(--radius); padding:10px 14px; font-size:.8rem; margin-bottom:22px; line-height:1.5; backdrop-filter:blur(6px);}
  .banner strong{color:#f3c46b;}

  /* Textes posés directement sur la photo (hors cartes) */
  #app > h2{color:var(--on-photo); font-size:1.7rem; text-shadow:0 1px 12px rgba(0,0,0,.4);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:16px; box-shadow:0 12px 40px rgba(0,0,0,.28);}
  .card + .card{margin-top:16px;}

  /* Accueil : le titre s'affiche sur la photo, le reste dans une carte */
  .hero{background:transparent; border:none; box-shadow:none; padding:28px 0 8px; color:var(--on-photo);}
  .hero .kicker{display:inline-block; font-family:'Rajdhani'; font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:.82rem; color:var(--brand); margin-bottom:8px;}
  .hero h1{font-size:clamp(2.1rem, 6vw, 3.3rem); line-height:1.02; margin:0 0 10px; text-transform:uppercase; letter-spacing:.02em; text-shadow:0 2px 18px rgba(0,0,0,.45);}
  .hero .price-row{display:flex; align-items:baseline; gap:14px; margin:18px 0; flex-wrap:wrap;}
  .price-old{font-family:'IBM Plex Mono'; text-decoration:line-through; color:var(--muted); font-size:1.15rem;}
  .hero .price-old{color:var(--on-photo-muted);}
  .price-new{font-family:'IBM Plex Mono'; font-weight:600; font-size:1.9rem; color:var(--accent);}
  .hero .price-new{color:var(--brand);}
  .price-tag{font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; background:var(--brand); color:var(--brand-ink); padding:4px 10px; border-radius:999px; font-weight:700;}
  .lede{color:var(--muted); font-size:.95rem; max-width:60ch; line-height:1.55;}
  .hero .deadline{display:inline-block; margin:0 0 14px; padding:6px 12px; border-left:3px solid var(--brand); background:rgba(0,0,0,.35); border-radius:0 8px 8px 0; color:var(--on-photo); font-size:.95rem;}
  .hero .deadline b{color:var(--brand);}
  .hero .lede{color:var(--on-photo-muted); font-size:1rem; text-shadow:0 1px 8px rgba(0,0,0,.5);}

  .cta-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  .btn{appearance:none; border:none; border-radius:8px; padding:12px 20px; font-weight:600; font-size:.92rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:44px;}
  .btn-primary{background:var(--brand); color:var(--brand-ink); font-weight:700;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn-ghost:hover{border-color:var(--accent);}
  .hero .btn-ghost{color:var(--on-photo); border-color:rgba(255,255,255,.55); background:rgba(0,0,0,.2);}
  .hero .btn-ghost:hover{border-color:var(--on-photo);}
  .btn-text{background:none; border:none; color:var(--muted); font-size:.82rem; text-decoration:underline; cursor:pointer; padding:4px 2px; min-height:24px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-sm{padding:7px 12px; font-size:.8rem; min-height:34px;}
  .btn-danger{background:var(--bad-bg); color:var(--danger);}

  .conditions{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-top:26px;}
  .cond{border:1px solid var(--glass-line); border-top:3px solid var(--brand); border-radius:10px; padding:12px 14px; font-size:.8rem; color:var(--on-photo-muted); background:var(--glass); backdrop-filter:blur(6px); line-height:1.45;}
  .cond b{display:block; color:var(--on-photo); font-family:'Rajdhani'; font-size:1rem; font-weight:700; margin-bottom:3px; text-transform:uppercase; letter-spacing:.04em;}

  .stepper{display:flex; gap:6px; margin-bottom:20px; overflow-x:auto; padding-bottom:4px;}
  .step-pill{flex:1; min-width:86px; text-align:center; padding:8px 6px; border-radius:8px; border:1px solid var(--glass-line); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--on-photo-muted); background:var(--glass); white-space:nowrap; backdrop-filter:blur(6px);}
  .step-pill .n{display:block; font-family:'IBM Plex Mono'; font-size:.95rem; color:var(--on-photo); margin-bottom:2px;}
  .step-pill.active{border-color:var(--brand); background:var(--brand); color:var(--brand-ink); font-weight:700;}
  .step-pill.active .n{color:var(--brand-ink);}
  .step-pill.done{border-color:rgba(45,190,196,.55); color:var(--on-photo);}
  .step-pill.done .n{color:var(--brand);}

  label{display:block; font-size:.82rem; font-weight:600; margin-bottom:6px;}
  .hint{font-size:.76rem; color:var(--muted); margin-top:4px;}
  .field{margin-bottom:16px;}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:.92rem; font-family:'IBM Plex Mono',monospace; min-height:44px;
  }
  select,textarea{font-family:'Work Sans';}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .row2{grid-template-columns:1fr;} }

  .choice-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .choice-row{grid-template-columns:1fr;} }

<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------- VIN database ---------- */
  var RAW_VIN_DATA = "";

  function parseVinDb(raw){
    var tokens = raw.split(/\s+/).filter(Boolean);
    var db = {}, current = null;
    for (var i=0;i<tokens.length;i++){
      var t = tokens[i];
      if (/^container$/i.test(t)) { current = parseInt(tokens[i+1],10); i++; continue; }
      if (current) db[t.toUpperCase()] = current;
    }
    return db;
  }
  var VIN_DB = parseVinDb(RAW_VIN_DATA);
  var THRESHOLD_CLIENT = 25;   // particuliers / motos déjà vendues
  var THRESHOLD_CONCESSION = 21; // stock concessionnaire, nouveaux coloris
  var ADMIN_PASSCODE = null; // mode démonstration uniquement (en production : compte Supabase)
  var INTERNAL_EXCEPTION_CAP = null; // mode démonstration ; en production le plafond vient du serveur (réservé à l'admin)

  // Connexion Supabase. Vides = mode démonstration (données dans ce navigateur uniquement).
  // Renseignées automatiquement par deploy/build.js pour la version en ligne.
  var SUPABASE_URL = "https://csagimardpwdvfybychz.supabase.co";
  var SUPABASE_KEY = "sb_publishable_VMegGr6eBq2Bwr6WcIJSjw_I2dWrp9v";
  var REMOTE = !!(SUPABASE_URL && SUPABASE_KEY);

  // Informations légales affichées sur la page « Données personnelles et mentions légales ».
  // Toute valeur commençant par « [À COMPLÉTER » est surlignée sur la page tant qu'elle n'est pas remplie.
  var LEGAL = {
    responsable: 'TRC Racing',
    // Source : registre national des entreprises (SIREN 807 775 184), consulté le 14/10/2026.
    formeCapital: 'SAS au capital de 10 000 €',
    adresse: '34 avenue Lavoisier, 63170 Aubière',
    rcsSiret: 'RCS Clermont-Ferrand 807 775 184, SIRET 807 775 184 00037',
    contactDonnees: 'adrien.trcracing@gmail.com',
    directeurPublication: 'Robin Charbonnier, Président',
    hebergeur: 'GitHub, Inc. (service GitHub Pages), 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis, téléphone +1 877 448 4820',
    dureeDossier: '90 jours après la clôture du dossier'
  };

  /* ---------- storage helpers ---------- */
  var LS = {
    get: function(key, def){
      try {
        var v = localStorage.getItem(key);
        if (!v) return def;
        var parsed = JSON.parse(v);
        // Données corrompues ou d'un autre type : on repart de la valeur par défaut
        if (Array.isArray(def) ? !Array.isArray(parsed) : (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed))) return def;
        return parsed;
      } catch(e){ return def; }
    },
    set: function(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch(e){ return false; } }
  };
  function getTickets(){ return LS.get('trc_tickets', []).filter(function(t){ return t && typeof t === 'object' && typeof t.id === 'string'; }); }
  function saveTickets(arr){ return LS.set('trc_tickets', arr); }
  function upsertTicket(t){
    var arr = getTickets();
    var i = arr.findIndex(function(x){ return x.id === t.id; });
    t.updatedAt = Date.now();
    if (i >= 0) arr[i] = t; else arr.push(t);
    return saveTickets(arr);
  }
  function findTicket(id){ return getTickets().find(function(t){ return t.id === id; }); }
  function nextTicketId(){
    var n = 0;
    try { n = parseInt(localStorage.getItem('trc_ticket_seq'), 10) || 0; } catch(e){}
    // Le compteur peut avoir été perdu ou être en retard : on repart du plus grand numéro existant.
    var ids = {};
    getTickets().forEach(function(t){ ids[t.id] = true; var m = /-(\d+)$/.exec(t.id); if (m) n = Math.max(n, parseInt(m[1], 10)); });
    var id;
    do { n += 1; id = 'RB-' + new Date().getFullYear() + '-' + String(n).padStart(4,'0'); } while (ids[id]);
    try { localStorage.setItem('trc_ticket_seq', String(n)); } catch(e){}
    return id;
  }
  function getLocks(){ return LS.get('trc_locks', {}); }
  function saveLocks(l){ return LS.set('trc_locks', l); }
  function cleanExpiredLocks(){
    var l = getLocks(), now = Date.now(), changed = false;
    for (var vin in l){
      if (!l[vin] || typeof l[vin] !== 'object'){ delete l[vin]; changed = true; continue; }
      if (l[vin].status === 'verification' && now - l[vin].ts > 7*24*3600*1000){ delete l[vin]; changed = true; }
    }
    if (changed) saveLocks(l);
    return l;
  }
  function isVinLocked(vin){ var l = cleanExpiredLocks(); return l[vin] || null; }
  function lockVin(vin, ticketId){ var l = cleanExpiredLocks(); l[vin] = { status:'verification', ts: Date.now(), ticketId: ticketId }; saveLocks(l); }
  function markVinSubmitted(vin){ var l = cleanExpiredLocks(); if (l[vin]){ l[vin].status = 'dossier_en_cours'; saveLocks(l); } }
  function releaseVin(vin, ticketId){ var l = cleanExpiredLocks(); if (l[vin] && l[vin].ticketId === ticketId){ delete l[vin]; saveLocks(l); } }
  function isVinLockedByOther(vin, ticketId){ var lk = isVinLocked(vin); return lk && lk.ticketId !== ticketId ? lk : null; }
  function isTicketClosed(id){ var t = findTicket(id); return !!(t && (t.status === 'valide_cloture' || t.status === 'rejete')); }
  // Autre dossier qui utilise déjà ce VIN (verrou actif, ou VIN présent dans un dossier envoyé, même hors liste). Les clôturés d'abord.
  function vinOwner(vin, exceptId){
    var lk = isVinLockedByOther(vin, exceptId);
    var found = getTickets().filter(function(t){
      if (t.id === exceptId) return false;
      if (lk && lk.ticketId === t.id) return true;
      if (t.status === 'verification') return false;
      return t.vin === vin || (t.exceptionRequest && t.exceptionRequest.vin === vin) ||
        (Array.isArray(t.motos) && t.motos.some(function(m){ return m && m.vin === vin; }));
    });
    found.sort(function(a, b){ return (isTicketClosed(b.id) ? 1 : 0) - (isTicketClosed(a.id) ? 1 : 0); });
    return found[0] || (lk ? { id: lk.ticketId, status: '' } : null);
  }

  /* ---------- accès aux données ----------
     Toutes les lectures / écritures de dossiers passent par Store (promesses).
     localStore : démonstration, tout reste dans ce navigateur.
     remoteStore : Supabase ; les règles métier sont revérifiées par le serveur (supabase/01-schema.sql). */
  function P(v){ return Promise.resolve(v); }

  function localStore(){
    return {
      checkVin: function(vinRaw, mode){
        var r = checkVinEligibility(vinRaw, mode);
        if (r.ok) { var lk = isVinLocked(r.vin); r.locked = lk ? { ts: lk.ts, closed: isTicketClosed(lk.ticketId) } : null; }
        return P(r);
      },
      reserveVin: function(vinRaw, ticket){
        var res = checkVinEligibility(vinRaw, 'client');
        if (!res.ok) return P(res);
        var ownId = ticket ? ticket.id : null;
        var lock = isVinLockedByOther(res.vin, ownId);
        if (lock) return P({ ok:false, reason:'locked', vin: res.vin, ts: lock.ts, closed: isTicketClosed(lock.ticketId) });
        if (ticket && ticket.vin !== res.vin) {
          // Le client a changé de VIN : on libère l'ancien et on garde le même dossier.
          releaseVin(ticket.vin, ticket.id);
          ticket.vin = res.vin; ticket.container = res.container;
        }
        var id = ownId || nextTicketId();
        lockVin(res.vin, id);
        var t = ticket || { id: id, createdAt: Date.now(), profile: 'particulier', status: 'verification', vin: res.vin, container: res.container };
        upsertTicket(t);
        return P({ ok:true, vin: res.vin, container: res.container, ticket: t, token: null });
      },
      submitParticulier: function(w){
        if (isVinLockedByOther(w.vinResult.vin, w.ticket.id)) return P({ ok:false, reason:'locked' });
        var ticket = {
          id: w.ticket.id, createdAt: w.ticket.createdAt, profile:'particulier', status:'en_cours',
          vin: w.vinResult.vin, container: w.vinResult.container, country: w.country,
          regDate: w.regDate, diffDays: w.bracket.diffDays, bracket: w.bracket.bracket,
          docs: w.docs, coords: w.coords, cgu: w.cgu,
          compensation: { label: compensationLabel(w.bracket.bracket) }
        };
        if (!upsertTicket(ticket)) return P({ ok:false, reason:'storage' });
        lockVin(ticket.vin, ticket.id);   // le verrou a pu expirer pendant la saisie
        markVinSubmitted(ticket.vin);
        return P({ ok:true, ticket: ticket });
      },
      submitPro: function(w){
        // Re-contrôle au moment de l'envoi : un autre dossier a pu réclamer un VIN entre-temps.
        var taken = w.motos.filter(function(m){ return isVinLocked(m.check.vin); }).map(function(m){ return m.check.vin; });
        if (taken.length) return P({ ok:false, reason:'locked', taken: taken });
        var id = nextTicketId();
        var total = w.motos.reduce(function(s,m){ return s + proAvoirForRemise(m.remise); }, 0);
        var ticket = { id: id, createdAt: Date.now(), profile:'pro', proSituation: w.proSituation, status:'en_cours', motos: w.motos.map(function(m){ return { vin:m.check.vin, container:m.check.container, achatDate:m.achatDate, remise:m.remise, factureTRC:m.factureTRC.trim() }; }), proCoords: w.proCoords, totalAvoir: total };
        if (!upsertTicket(ticket)) return P({ ok:false, reason:'storage' });
        w.motos.forEach(function(m){ lockVin(m.check.vin, id); markVinSubmitted(m.check.vin); });
        return P({ ok:true, ticket: ticket });
      },
      submitException: function(ex, w){
        var ctx = ex.context || {}, vin = normalizeVin(ex.vin);
        if (!vin) return P({ ok:false, reason:'vin_required' });
        // Si un dossier « vérification » existe déjà pour ce parcours, la demande le remplace (pas de dossier orphelin).
        var reuse = w.ticket && w.ticket.status === 'verification';
        var owner = vinOwner(vin, reuse ? w.ticket.id : null);
        if (owner) return P({ ok:false, reason:'vin_taken', closed: isTicketClosed(owner.id) });
        if (reuse && w.ticket.vin && w.ticket.vin !== vin) releaseVin(w.ticket.vin, w.ticket.id);   // VIN corrigé dans la demande
        var id = reuse ? w.ticket.id : nextTicketId();
        var t = {
          id: id, createdAt: reuse ? w.ticket.createdAt : Date.now(), profile: w.profile || 'inconnu', status: 'exception_manuelle',
          exceptionRequest: {
            reasonLabel: ex.reasonLabel, nom: ex.nom.trim(), email: ex.email.trim(), telephone: ex.telephone.trim(), message: ex.message.trim(),
            vin: vin, container: VIN_DB[vin] || null, regDate: ctx.regDate, diffDays: ctx.diffDays, country: ctx.country
          }
        };
        if (!upsertTicket(t)) return P({ ok:false, reason:'storage' });
        if (VIN_DB[vin]) { lockVin(vin, id); markVinSubmitted(vin); }
        return P({ ok:true, id: id });
      },
      track: function(id, contact){
        var tk = findTicket(String(id).trim().toUpperCase());
        return P(tk && contactMatches(tk, contact) ? tk : null);
      },
      resubmit: function(result, contact, up){
        var tk = findTicket(result.id) || result;
        if (tk.status !== 'documents_rejetes') return P({ ok:false, reason:'status', ticket: tk });
        tk.docs = tk.docs || {};
        if (up.carteGrise) tk.docs.carteGrise = up.carteGrise;
        if (up.facture) tk.docs.facture = up.facture;
        tk.status = 'en_cours'; tk.docRejectReason = '';
        if (!upsertTicket(tk)) return P({ ok:false, reason:'storage' });
        return P({ ok:true, ticket: tk });
      },
      adminLogin: function(a){ return P(a.passInput.trim() === ADMIN_PASSCODE ? { ok:true, cap: INTERNAL_EXCEPTION_CAP } : { ok:false, error:'Code incorrect.' }); },
      adminLogout: function(){},
      // Lecture directe à chaque affichage : un dossier créé dans un autre onglet apparaît aussitôt.
      adminList: function(){ return getTickets().slice().sort(function(x,y){ return y.updatedAt - x.updatedAt; }); },
      adminTicket: function(id){ return findTicket(id); },
      adminRefresh: function(){ return P(); },
      adminAction: function(id, action, opts){
        var t = findTicket(id);
        if (!t || isClosed(t)) return P({ ok:false, reason:'closed' });
        if (action === 'validate') { t.status = 'valide_cloture'; if (opts.reason) t.validationNote = opts.reason; }
        else if (action === 'reject_doc') { t.status = 'documents_rejetes'; t.docRejectReason = opts.reason; }
        else if (action === 'grant_exception') { if (t.status !== 'exception_manuelle') return P({ ok:false, reason:'status' }); t.totalAvoir = opts.amount; t.status = 'valide_cloture'; }
        else if (action === 'close_nosuite') t.status = 'rejete';
        upsertTicket(t);
        return P({ ok:true, ticket: t });
      }
    };
  }

  function remoteStore(){
    var session = null;   // { token } du compte admin, en mémoire seulement (recharger = déconnexion)
    var list = [], detail = null;
    function headers(json, asAdmin){
      var h = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + (asAdmin && session ? session.token : SUPABASE_KEY) };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }
    function request(url, init){
      return fetch(url, init).catch(function(){ var e = new Error('network'); e.code = 'network'; throw e; }).then(function(r){
        return r.text().then(function(txt){
          var body = null; try { body = txt ? JSON.parse(txt) : null; } catch(e){}
          if (!r.ok) {
            var err = new Error((body && (body.message || body.msg || body.error_description || body.error)) || ('HTTP ' + r.status));
            err.status = r.status; err.code = r.status === 401 || r.status === 403 ? 'auth' : 'server'; throw err;
          }
          return body;
        });
      });
    }
    function rpc(fn, args, asAdmin){
      return request(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers: headers(true, asAdmin), body: JSON.stringify(args || {}) });
    }
    function extOf(doc){
      var m = /\.([a-z0-9]{1,5})$/i.exec(doc.name || '');
      if (m) return m[1].toLowerCase();
      return doc.type === 'application/pdf' ? 'pdf' : (doc.type || '').split('/')[1] || 'bin';
    }
    // Dépose une pièce dans « <dossier>/<jeton>/<nom>-<aléa>.<ext> » (dossier privé, l'admin seul peut la lire).
    function upload(ticketId, token, key, doc){
      var type = doc.type || (/\.pdf$/i.test(doc.name || '') ? 'application/pdf' : 'application/octet-stream');
      var rand = Math.random().toString(36).slice(2, 10);
      var path = ticketId + '/' + token + '/' + key + '-' + rand + '.' + extOf(doc);
      return fetch(doc.dataUrl).then(function(r){ return r.blob(); }).then(function(blob){
        return request(SUPABASE_URL + '/storage/v1/object/justificatifs/' + path.split('/').map(encodeURIComponent).join('/'),
          { method:'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': type, 'x-upsert': 'false' }, body: blob });
      }).then(function(){ return { name: doc.name, type: type, size: doc.size, path: path }; });
    }
    function uploadAll(ticketId, token, docs){
      var keys = Object.keys(docs).filter(function(k){ return docs[k]; });
      return Promise.all(keys.map(function(k){ return upload(ticketId, token, k, docs[k]); })).then(function(res){
        var out = {}; keys.forEach(function(k, i){ out[k] = res[i]; }); return out;
      });
    }
    function sign(doc){
      if (!doc || !doc.path) return P(doc);
      return request(SUPABASE_URL + '/storage/v1/object/sign/justificatifs/' + doc.path.split('/').map(encodeURIComponent).join('/'),
        { method:'POST', headers: headers(true, true), body: JSON.stringify({ expiresIn: 900 }) })
        .then(function(r){ var u = r && (r.signedURL || r.signedUrl); return Object.assign({}, doc, { url: u ? SUPABASE_URL + '/storage/v1' + u : null }); })
        .catch(function(){ return doc; });
    }
    function loadDetail(id){
      return rpc('admin_get', { p_id: id }, true).then(function(t){
        if (!t || !t.docs) return t;
        return Promise.all([sign(t.docs.carteGrise), sign(t.docs.facture)]).then(function(d){ t.docs = { carteGrise: d[0], facture: d[1] }; return t; });
      }).then(function(t){
        if (!t) return t;
        // Emails envoyés au client : affichage seulement, une erreur ici ne bloque pas la fiche.
        return rpc('admin_emails', { p_id: id }, true).then(function(e){ t.emails = e || []; return t; }, function(){ return t; });
      }).then(function(t){ detail = t; return t; });
    }
    return {
      checkVin: function(vinRaw, mode){
        var v = normalizeVin(vinRaw);
        if (!v) return P({ ok:false, reason:'empty' });
        return rpc('check_vin', { p_vin: v, p_mode: mode });
      },
      reserveVin: function(vinRaw, ticket, token){
        var v = normalizeVin(vinRaw);
        if (!v) return P({ ok:false, reason:'empty' });
        return rpc('reserve_vin', { p_vin: v, p_ticket_id: ticket ? ticket.id : null, p_token: ticket ? token : null });
      },
      submitParticulier: function(w){
        return uploadAll(w.ticket.id, w.token, w.docs).then(function(docs){
          return rpc('submit_particulier', { p_ticket_id: w.ticket.id, p_token: w.token, p_data: {
            country: w.country, regDate: w.regDate, coords: w.coords, cgu: w.cgu, docs: docs } });
        });
      },
      submitPro: function(w){
        return rpc('submit_pro', { p_data: { proSituation: w.proSituation, proCoords: w.proCoords,
          motos: w.motos.map(function(m){ return { vin: m.check.vin, achatDate: m.achatDate, remise: m.remise, factureTRC: m.factureTRC }; }) } })
          .catch(function(e){ if (/vin_locked_concurrently/.test(e.message)) return { ok:false, reason:'locked', taken: [] }; throw e; });
      },
      submitException: function(ex, w){
        var ctx = ex.context || {};
        var reuse = w.ticket && w.ticket.status === 'verification';
        return rpc('submit_exception', { p_ticket_id: reuse ? w.ticket.id : null, p_token: reuse ? w.token : null, p_data: {

  function readFileAsDataUrl(file, maxBytes){
    return new Promise(function(resolve, reject){
      if (!/^image\//.test(file.type) && file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { reject({code:'bad_type'}); return; }
      if (!file.size) { reject({code:'empty'}); return; }
      if (file.size > maxBytes) { reject({code:'too_large'}); return; }
      var reader = new FileReader();

  function renderMotosLines(){
    var w = state.wizard;
    var out = '<h2>Motos concernées</h2><p class="lede">Ajoutez chaque moto de votre stock invendu concernée par cette opération. L\'éligibilité de chaque numéro de série est vérifiée automatiquement.</p>';
    w.motos.forEach(function(m, i){
      var statusHtml = '';
      if (m.check) {
        if (m.check.ok) statusHtml = '<span class="badge ok">Éligible</span>';
        else if (m.check.reason === 'not_found') statusHtml = '<span class="badge bad">VIN non reconnu</span>';
        else if (m.check.reason === 'container_too_old') statusHtml = '<span class="badge bad">Hors périmètre : ne fait pas partie des séries concernées</span>';
        else if (m.check.reason === 'closed') statusHtml = '<span class="badge bad">Déjà traité dans un dossier clôturé</span>';
        else if (m.check.reason === 'locked') statusHtml = '<span class="badge pending">Dossier déjà en cours pour ce VIN</span>';
        else if (m.check.reason === 'duplicate') statusHtml = '<span class="badge bad">VIN déjà saisi sur une autre ligne de ce dossier</span>';
        else if (m.check.reason === 'date_future') statusHtml = '<span class="badge bad">Date d\'achat dans le futur</span>';
        else if (m.check.reason === 'empty') statusHtml = '<span class="badge bad">Saisissez un numéro de série</span>';
      }
      var avoirPreview = (m.check && m.check.ok && m.check.vin === normalizeVin(m.vin)) ? ('<span class="hint">Avoir estimé : <b>' + fmtEUR(proAvoirForRemise(m.remise)) + '</b></span>') : '';
      out += '<div class="moto-line">' +
        '<div class="grid4">' +
          '<div><label>N° de série (VIN)</label><input type="text" data-field="wizard.motos.' + i + '.vin" value="' + escapeHtml(m.vin) + '"></div>' +
          '<div><label>Date d\'achat</label><input type="date" data-field="wizard.motos.' + i + '.achatDate" value="' + escapeHtml(m.achatDate) + '" max="' + todayISO() + '"></div>' +
          '<div><label>Remise sur facture (%)</label><input type="number" min="0" max="100" data-field="wizard.motos.' + i + '.remise" value="' + escapeHtml(m.remise) + '"></div>' +
          '<div><label>N° facture TRC</label><input type="text" data-field="wizard.motos.' + i + '.factureTRC" value="' + escapeHtml(m.factureTRC) + '"></div>' +
        '</div>' +
        '<div class="status">' + statusHtml + ' ' + avoirPreview + '</div>' +
        '<div style="margin-top:8px; display:flex; gap:8px;">' +
          '<button class="btn btn-ghost btn-sm" data-action="check-moto-line" data-index="' + i + '">Vérifier ce VIN</button>' +
          (w.motos.length > 1 ? '<button class="btn btn-ghost btn-sm" data-action="remove-moto-line" data-index="' + i + '">Retirer</button>' : '') +
        '</div>' +
      '</div>';
    });

    var allOk = allMotosOk(w);
    out += '<div class="nav-row"><button class="btn btn-ghost" data-action="wizard-back">← Retour</button>' +
      '<button class="btn btn-primary" data-action="wizard-next" ' + (allOk?'':'disabled') + '>Continuer →</button></div>';

    return out;
  }

        (t.error ? '<div class="msg error" role="alert">' + t.error + '</div>' : '') +

      '</div>';
    } else {
      var tk = t.result;
      out += '<div class="card"><h3 class="mono">' + escapeHtml(tk.id) + '</h3>' + statusBadge(tk.status) +
        '<dl class="recap">' +

      if (tk.compensation) out += '<dt>Compensation</dt><dd>' + escapeHtml(tk.compensation.label) + '</dd>';
      if (tk.totalAvoir) out += '<dt>Avoir</dt><dd>' + fmtEUR(tk.totalAvoir) + '</dd>';
      out += '</dl>';
      if (tk.status === 'documents_rejetes') {
        out += '<div class="msg error" role="alert">Un document est non conforme ou illisible. Merci de le remplacer ci-dessous.</div>' +
          '<div class="field"><label>Remplacer la carte grise</label><label class="file-drop"><span data-reupload-label="carteGrise">' + (t.reupload.carteGrise ? '✓ ' + escapeHtml(t.reupload.carteGrise.name) : 'Cliquer pour joindre un fichier') + '</span><input type="file" accept="image/*,.pdf" data-reupload="carteGrise"></label></div>' +
          '<div class="field"><label>Remplacer la facture</label><label class="file-drop"><span data-reupload-label="facture">' + (t.reupload.facture ? '✓ ' + escapeHtml(t.reupload.facture.name) : 'Cliquer pour joindre un fichier') + '</span><input type="file" accept="image/*,.pdf" data-reupload="facture"></label></div>' +
          (t.reuploadError ? '<div class="msg error" role="alert">' + escapeHtml(t.reuploadError) + '</div>' : '') +
          '<button class="btn btn-primary btn-sm" data-action="track-resubmit">Renvoyer les documents</button>';
      } else if (tk.status === 'valide_cloture') {
        out += '<div class="msg ok">Ce dossier est validé et clôturé. Aucun nouveau message ne peut être envoyé.</div>';

      } else {
        out += '<div class="msg info">Votre dossier est en cours de traitement par nos équipes.</div>';
      }
      out += '<div class="nav-row"><button class="btn btn-ghost" data-action="track-reset">← Nouvelle recherche</button></div></div>';
    }
    return out;
  }

  function statusBadge(status){
    var map = {
      verification: ['pending','Vérification en cours'],
      en_cours: ['pending','Dossier en cours'],
      documents_rejetes: ['bad','Document à remplacer'],
      valide_cloture: ['ok','Validé et clôturé'],
      hors_delai: ['bad','Hors délai'],
      exception_manuelle: ['pending','Demande exceptionnelle'],
      redirige_particulier: ['bad','À déposer par le client final'],
      rejete: ['bad','Clôturé sans suite']
    };
    var m = map[status] || ['pending', escapeHtml(status)];
    return '<span class="badge ' + m[0] + '">' + m[1] + '</span>';
  }

  var ADMIN_FILTERS = {
    a_traiter:   { label: 'À traiter',           test: function(t){ return t.status === 'en_cours' || t.status === 'exception_manuelle'; } },
    documents:   { label: 'Document à renvoyer', test: function(t){ return t.status === 'documents_rejetes'; } },
    clotures:    { label: 'Clôturés',            test: function(t){ return t.status === 'valide_cloture' || t.status === 'rejete'; } },
    non_envoyes: { label: 'Non envoyés',         test: function(t){ return t.status === 'verification'; } },
    tous:        { label: 'Tous',                test: function(){ return true; } }
  };
  // Résumé d'un dossier pour la liste : le serveur envoie déjà ces champs, la démonstration les déduit du dossier complet.
  function adminSummary(t){
    var c = t.coords || {}, pc = t.proCoords || {}, ex = t.exceptionRequest || {};
    return {
      nom: t.nom || ((c.prenom || '') + ' ' + (c.nom || '')).trim() || pc.raisonSociale || ex.nom || '',
      email: t.email || c.email || pc.email || ex.email || '',
      vins: t.vins || (t.motos ? t.motos.map(function(m){ return m.vin; }) : (t.vin || ex.vin ? [t.vin || ex.vin] : [])),
      montant: t.totalAvoir ? fmtEUR(t.totalAvoir) : (typeof t.compensation === 'string' ? t.compensation : (t.compensation && t.compensation.label) || '')
    };
  }
  function adminListBodyHtml(tickets){
    var a = state.admin, filter = ADMIN_FILTERS[a.filter] ? a.filter : 'a_traiter';
    var q = String(a.search || '').trim().toLowerCase().replace(/\s+/g, ' ');
    var list = tickets.filter(ADMIN_FILTERS[filter].test).filter(function(t){
      if (!q) return true;
      var s = adminSummary(t);
      return [t.id, s.nom, s.email].concat(s.vins).join(' ').toLowerCase().indexOf(q) !== -1;
    });
    if (!list.length) return '<p class="lede">' + (q ? 'Aucun dossier ne correspond à cette recherche.' : 'Aucun dossier dans cette catégorie.') + '</p>';
    var rows = list.map(function(t){
      var s = adminSummary(t);
      return '<tr data-action="admin-open" data-id="' + escapeHtml(t.id) + '"><td class="mono">' + escapeHtml(t.id) + '</td>' +
        '<td>' + escapeHtml(s.nom || '—') + '<br><span class="hint">' + escapeHtml(t.profile) + (s.email ? ' · ' + escapeHtml(s.email) : '') + '</span></td>' +
        '<td class="mono">' + (s.vins.length ? s.vins.map(escapeHtml).join('<br>') : '—') + '</td>' +
        '<td>' + statusBadge(t.status) + (s.montant ? '<br><span class="hint">' + escapeHtml(s.montant) + '</span>' : '') + '</td>' +
        '<td>' + fmtDate(t.updatedAt) + '</td></tr>';
    }).join('');
    return '<div class="table-scroll"><table class="admin"><thead><tr><th>Dossier</th><th>Client</th><th>VIN</th><th>Statut</th><th>MàJ</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

    if (t.status === 'exception_manuelle') out += '<button class="btn btn-ghost btn-sm" data-action="admin-grant-exception" data-id="' + t.id + '">Accorder un geste au cas par cas</button>';
    out += '<button class="btn btn-danger btn-sm" data-action="admin-close-nosuite" data-id="' + t.id + '">Clôturer sans suite</button>';

  /* ================= HISTORIQUE DU NAVIGATEUR ================= */
  // Chaque écran ajoute une entrée à l'historique : les boutons Précédent / Suivant du navigateur
  // naviguent entre les étapes au lieu de quitter le site. Les saisies sont conservées.
  var navReady = false, navRestoring = false, navLastKey = '';
  function navState(){
    var w = state.wizard, ex = state.exception;
    return { view: state.view, step: w.step, profile: w.profile, exc: !!ex.open, sent: !!ex.sent,
             sel: state.view === 'admin' ? state.admin.selected : null, tr: !!state.track.result };
  }
  function syncHistory(){
    var n = navState(), key = JSON.stringify(n);
    if (key === navLastKey) return;
    try {
      if (!navReady || navRestoring) history.replaceState({ nav: n }, '');
      else history.pushState({ nav: n }, '');
    } catch(e){}
    navLastKey = key; navReady = true;
  }
  function isSubmitted(w){ return !!(w.ticket && w.ticket.status && w.ticket.status !== 'verification'); }
  // L'étape s peut-elle être franchie avec les données actuellement saisies ?
  function stepPassable(w, s){
    if (w.profile === 'particulier' && s === 2) return !!(w.vinResult && w.ticket && w.vinResult.vin === normalizeVin(w.vin));
    var saved = w.step; w.step = s; var err = stepError(w); w.step = saved;
    return !err;
  }
  function applyNav(n){
    var w = state.wizard;
    if (!n || !n.view) n = { view: 'home' };
    state.exception.open = state.exception.open && n.view === 'wizard';
    if (n.view === 'confirmation-particulier' || n.view === 'confirmation-pro') {
      var okConf = isSubmitted(w) && ((n.view === 'confirmation-pro') === (w.profile === 'pro'));
      state.view = okConf ? n.view : 'home';
      return;
    }
    if (n.view === 'wizard') {
      // Un dossier déjà envoyé ne se rouvre pas par l'historique : retour à l'accueil.
      if (isSubmitted(w) || state.exception.sent) { state.view = 'home'; state.exception = initException(); return; }
      state.view = 'wizard';
      w.formError = '';
      state.exception.open = !!(n.exc && state.exception.reasonLabel);
      if (!n.profile || !n.step) { w.profile = null; w.step = 0; w.proSituation = null; return; }
      w.profile = n.profile;
      var target = n.step, s = 1;
      while (s < target && stepPassable(w, s)) s++;
      w.step = s;
      return;
    }
    state.view = n.view;
    if (n.view === 'home') state.exception = initException();
    if (n.view === 'track' && !n.tr) state.track.result = null;
    if (n.view === 'admin') {
      var sel = state.admin.authed && n.sel && (REMOTE || findTicket(n.sel)) ? n.sel : null;
      if (sel !== state.admin.selected) { state.admin.selected = sel; state.admin.fraudCheck = false; state.admin.ecartMotif = ''; state.admin.actionError = ''; }
    }
  }
  window.addEventListener('popstate', function(e){
    navRestoring = true;
    try { applyNav(e.state && e.state.nav); render(); } finally { navRestoring = false; }
    if (state.view === 'admin') adminReload();
  });

  /* ================= EVENTS ================= */
  function bindEvents(){
    app.querySelectorAll('[data-field]').forEach(function(el){
      // Associe chaque champ à son libellé (accessibilité) quand le balisage ne le fait pas.
      if (!(el.labels && el.labels.length)) {
        var prev = el.previousElementSibling;
        if (prev && prev.tagName === 'LABEL' && !prev.htmlFor) {
          if (!el.id) el.id = 'f-' + el.dataset.field.replace(/\./g, '-');
          prev.htmlFor = el.id;
        }
      }
      var evt = (el.tagName === 'SELECT' || el.type === 'date' || el.type==='file') ? 'change' : 'input';
      el.addEventListener(evt, function(){
        setPath(state, el.dataset.field, el.value);
        // Pas de re-rendu ici : reconstruire le DOM pendant la saisie ferait perdre
        // le focus et les caractères tapés dans le champ suivant.
      });
      if (el.dataset.field === 'wizard.regDate') {
        // On ne met à jour que la zone de résultat, jamais le champ lui-même,
        // pour ne pas voler le focus de l'élément sur lequel l'utilisateur clique.
        var showBracket = function(){
          var b = regBracket(el.value), box = document.getElementById('reg-feedback');
          // Rien ne change : on ne redessine pas, sinon le bouton « Continuer » sur lequel
          // l'utilisateur est en train de cliquer serait remplacé et le clic perdu.
          if (JSON.stringify(b) === JSON.stringify(state.wizard.bracket) && box && box.dataset.drawn) return;
          state.wizard.bracket = b;
          if (box) { box.innerHTML = regFeedbackHtml(b); box.dataset.drawn = '1'; makeKeyboardReachable(box); }
        };
        el.addEventListener('change', showBracket);
        el.addEventListener('blur', showBracket);
      }
    });
    app.querySelectorAll('[data-field-checkbox]').forEach(function(el){
      el.addEventListener('change', function(){
        setPath(state, el.dataset.fieldCheckbox, el.checked);
        render();
      });
    });
    app.querySelectorAll('[data-admin-search]').forEach(function(el){
      // Filtre en direct : on ne redessine que le tableau, pour garder le focus dans le champ.
      el.addEventListener('input', function(){
        state.admin.search = el.value;
        var box = document.getElementById('admin-list-body');
        if (box) { box.innerHTML = adminListBodyHtml(Store.adminList()); makeKeyboardReachable(box); }
      });
    });
    app.querySelectorAll('[data-admin-fraud]').forEach(function(el){
      el.addEventListener('change', function(){
        if (el.checked) { state.admin.fraudCheck = el.value; state.admin.actionError = ''; render(); }
      });
    });
    app.querySelectorAll('[data-upload]').forEach(function(el){
      el.addEventListener('change', function(){
        var file = el.files[0]; if (!file) return;
        readFileAsDataUrl(file, MAX_UPLOAD).then(function(res){
          state.wizard.docs[el.dataset.upload] = res;
          state.wizard.fileError = '';
          render();
        }).catch(function(err){
          state.wizard.fileError = fileErrorMsg(err.code);
          render();
        });
      });
    });
    app.querySelectorAll('[data-reupload]').forEach(function(el){
      el.addEventListener('change', function(){
        var file = el.files[0]; if (!file) return;
        readFileAsDataUrl(file, MAX_UPLOAD).then(function(res){
          state.track.reupload[el.dataset.reupload] = res;
          state.track.reuploadError = '';
          render();
        }).catch(function(err){
          state.track.reuploadError = fileErrorMsg(err.code);
          render();
        });
      });
    });
    makeKeyboardReachable(app);
    app.addEventListener('click', onClick);
    app.addEventListener('keydown', onKeydown);
  }

  // Entrée / Espace activent les éléments cliquables qui ne sont pas des <button> ;
  // Entrée dans un champ déclenche l'action principale de l'étape (ou la vérification de la ligne moto).
  function onKeydown(e){
    var el = e.target;
    if (el.matches('[data-action]:not(button)') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); return; }
    if (e.key !== 'Enter' || el.tagName !== 'INPUT' || /^(checkbox|radio|file|button|submit)$/.test(el.type)) return;
    var line = el.closest('.moto-line');
    var target = line ? line.querySelector('[data-action="check-moto-line"]') : (el.closest('.card') || app).querySelector('.btn-primary:not([disabled])');
    if (!target) return;
    e.preventDefault();
    el.blur(); // enregistre la saisie (ex. date d'immatriculation) avant l'action
    if (target.isConnected) target.click();
    else { var again = (app.querySelector('.card') || app).querySelector('.btn-primary:not([disabled])'); if (again) again.click(); }
  }

  function initTrack(){ return { ticketId:'', contact:'', result:null, error:'', reupload:{}, reuploadError:'' }; }

  // Retourne un message d'erreur si l'étape courante ne permet pas d'avancer, sinon ''.
  function stepError(w){
    if (w.profile === 'particulier') {
      if (w.step === 1) return (w.bracket && (w.bracket.bracket === 'lt60' || w.bracket.bracket === '60to90')) ? '' : 'Date d\'immatriculation non éligible.';
      if (w.step === 2) return 'Merci de vérifier votre numéro de série.';
      if (w.step === 3) return w.country === 'fr' ? '' : 'Opération réservée à la France métropolitaine.';
      if (w.step === 4) { var miss = validateParticulierDocs(w); return miss.length ? missingMsg(miss) : ''; }
      return 'Étape inconnue.';
    }
    if (w.profile === 'pro') {
      if (w.step === 1) return w.proSituation === 'stock' ? '' : 'Choisissez la situation de vos motos.';
      if (w.step === 2) return allMotosOk(w) ? '' : 'Toutes les motos doivent être vérifiées comme éligibles, sans doublon, avec date d\'achat et numéro de facture TRC.';
      if (w.step === 3) { var missP = validateProCoords(w.proCoords); return missP.length ? missingMsg(missP) : ''; }
      return 'Étape inconnue.';
    }
    return 'Choisissez votre profil.';
  }

  function contactMatches(tk, raw){
    var c = String(raw || '').trim();
    if (!c) return false;
    var email = c.toLowerCase(), phone = normalizePhone(c);
    return [tk.coords, tk.proCoords, tk.exceptionRequest].some(function(src){
      if (!src) return false;
      if (src.email && String(src.email).trim().toLowerCase() === email) return true;
      return phone.length >= 9 && src.telephone && normalizePhone(src.telephone) === phone;
    });
  }

  function isClosed(t){ return t.status === 'valide_cloture' || t.status === 'rejete'; }

  // Une seule opération serveur à la fois : un double-clic ne crée pas deux dossiers.
  var pending = false;
  function busy(promise){
    pending = true;
    document.body.setAttribute('aria-busy', 'true');
    return Promise.resolve(promise).then(function(){}, function(){}).then(function(){ pending = false; document.body.removeAttribute('aria-busy'); });
  }
  // Session admin expirée ou retirée : retour à l'écran de connexion.
  function adminError(e){
    if (e && e.code === 'auth') { Store.adminLogout(); state.admin = initAdmin(); state.admin.passError = 'Votre session a expiré. Merci de vous reconnecter.'; }
    else state.admin.actionError = serverErrorMsg(e);
  }
  // Recharge depuis le serveur la liste ou la fiche affichée (sans effet en mode démonstration).
  function adminReload(){
    if (!REMOTE || !state.admin.authed) return;
    var sel = state.admin.selected;
    Store.adminRefresh(sel).catch(adminError).then(function(){ if (state.view === 'admin' && state.admin.selected === sel) render(); });
  }

  var EMAIL_KIND = { recu:'Dossier reçu', exception:'Demande reçue', pieces_recues:'Nouveaux documents reçus', documents_rejetes:'Document à renvoyer', valide:'Dossier validé', rejete:'Dossier clôturé' };
  var EMAIL_STATUS = { attente:'en attente', transmis:'en cours d\'envoi', envoye:'envoyé', echec:'échec' };
  function adminEmailsHtml(list){
    var out = '<h3 style="margin-top:18px;">Emails au client</h3>';
    if (!list.length) return out + '<p class="hint">Aucun email pour ce dossier.</p>';
    return out + '<ul class="hint" style="padding-left:18px;">' + list.map(function(m){
      var when = new Date(m.sentAt || m.createdAt).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' });
      return '<li>' + escapeHtml(EMAIL_KIND[m.kind] || m.kind) + ' → ' + escapeHtml(m.to) + ' : <b>' + escapeHtml(EMAIL_STATUS[m.status] || m.status) + '</b> (' + when + ')' +
        (m.status !== 'envoye' && m.error ? ' — ' + escapeHtml(m.error) : '') + '</li>';
    }).join('') + '</ul>';
  }

  // Les éléments cliquables qui ne sont pas des <button> deviennent atteignables au clavier.
  function makeKeyboardReachable(root){
    root.querySelectorAll('[data-action]').forEach(function(el){
      if (el.tagName === 'BUTTON') return;
      el.tabIndex = 0;
      if (el.tagName !== 'TR') el.setAttribute('role', 'button');
    });
  }

  function onClick(e){
    // Second clic d'un double-clic : l'écran a souvent déjà changé, il tomberait sur autre chose.
    if (e.detail > 1) return;
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    var w = state.wizard;
    if (pending && /^(check-vin-particulier|send-exception|submit-particulier|submit-pro|track-lookup|track-resubmit|admin-login|admin-validate|admin-reject-doc|admin-grant-exception|admin-close-nosuite)$/.test(action)) return;

    if (action === 'start-wizard') { state.view = 'wizard'; state.wizard = initWizard(); state.exception = initException(); render(); }
    else if (action === 'go-home') { state.view = 'home'; state.exception = initException(); render(); }
    else if (action === 'go-track') { state.view = 'track'; state.track = initTrack(); render(); }
    else if (action === 'go-admin') { state.view = 'admin'; render(); adminReload(); }
    else if (action === 'go-privacy') { if (state.view !== 'privacy') state.privacyFrom = state.view; state.view = 'privacy'; window.scrollTo(0, 0); render(); }
    else if (action === 'privacy-back') { state.view = state.privacyFrom || 'home'; render(); }
    else if (action === 'admin-logout') { Store.adminLogout(); state.admin = initAdmin(); state.view='home'; render(); }

    else if (action === 'pick-profile') { w.profile = el.dataset.value; w.step = 1; w.formError = ''; render(); }
    else if (action === 'wizard-back') {
      if (w.step === 0 || (w.step === 1 && w.profile)) { w.profile = null; w.step = 0; w.proSituation = null; }
      else w.step -= 1;
      w.formError = '';
      render();
    }
    else if (action === 'wizard-next') {
      var err = stepError(w);
      if (err) { w.formError = err; render(); return; }
      w.formError = '';
      w.step += 1;
      render();
    }

    else if (action === 'check-vin-particulier') {
      busy(Store.reserveVin(w.vin, w.ticket, w.token).then(function(res){
        if (!res.ok) {
          w.errorException = null;
          if (res.reason === 'empty') w.error = 'Merci de saisir un numéro de série.';
          else if (res.reason === 'not_found') { w.error = 'Ce numéro de série ne figure pas dans la liste des motos concernées par cette opération.'; w.errorException = 'vin_non_reconnu'; }
          else if (res.reason === 'container_too_old') { w.error = 'Votre moto ne fait pas partie des séries de production concernées par cette baisse.'; w.errorException = 'container_trop_ancien'; }
          else if (res.reason === 'locked' && res.closed) w.error = CLOSED_VIN_MSG;
          else if (res.reason === 'locked') w.error = 'Un dossier est déjà en cours pour ce numéro de série' + (res.ts ? ' (ouvert le ' + fmtDate(res.ts) + ')' : '') + '. Merci de patienter ou de nous contacter si vous pensez qu\'il s\'agit d\'une erreur.';
          else { w.ticket = null; w.token = null; w.error = 'Votre dossier a expiré. Merci de vérifier à nouveau votre numéro de série.'; }
          if (res.reason !== 'locked') w.vinResult = null;
          render();
          return;
        }
        w.vinResult = { ok:true, vin: res.vin, container: res.container };
        w.vin = res.vin;
        w.error = '';
        w.ticket = res.ticket;
        if (res.token) w.token = res.token;
        w.step = 3;
        render();
      }).catch(function(e){ w.errorException = null; w.error = serverErrorMsg(e); render(); }));
    }
    else if (action === 'pick-country') { w.country = el.dataset.value; w.formError = ''; render(); }
    else if (action === 'open-exception') {
      var ctxVin = normalizeVin(w.vin);
      state.exception = initException();
      state.exception.open = true;
      state.exception.reasonLabel = el.dataset.value;
      state.exception.vin = ctxVin;
      state.exception.context = {
        vin: ctxVin || '', container: ctxVin ? (VIN_DB[ctxVin] || null) : null,
        regDate: w.regDate || '', diffDays: w.bracket ? w.bracket.diffDays : null, country: w.country || ''
      };
      render();
    }
    else if (action === 'close-exception') { state.exception.open = false; render(); }
    else if (action === 'send-exception') {
      var ex = state.exception;
      var missE = validateException(ex);
      if (missE.length) { ex.error = missingMsg(missE); render(); return; }
      busy(Store.submitException(ex, w).then(function(r){
        if (!r || !r.ok) {
          ex.error = r && r.reason === 'storage' ? 'Impossible d\'enregistrer la demande (espace de stockage du navigateur plein).'
            : r && r.reason === 'vin_required' ? 'Merci de renseigner le numéro de série (VIN) de votre moto.'
            : r && r.reason === 'vin_taken' ? (r.closed ? CLOSED_VIN_MSG : 'Un dossier existe déjà pour ce numéro de série. Utilisez « Suivre mon dossier » ou contactez-nous.')
            : 'Demande incomplète : vérifiez les champs ci-dessus.';
          render(); return;
        }
        w.ticket = null; w.token = null;
        ex.ticketId = r.id; ex.error = ''; ex.sent = true; render();
      }).catch(function(e){ ex.error = serverErrorMsg(e); render(); }));
    }

    else if (action === 'pick-pro-situation') { w.proSituation = el.dataset.value; w.formError = ''; render(); }
    else if (action === 'add-moto-line') { w.motos.push({ vin:'', achatDate:'', remise:'', factureTRC:'', check:null }); render(); }
    else if (action === 'remove-moto-line') { w.motos.splice(parseInt(el.dataset.index,10),1); render(); }
    else if (action === 'check-moto-line') {
      var i = parseInt(el.dataset.index,10);
      var m = w.motos[i];
      Store.checkVin(m.vin, 'concession').then(function(r){
        if (r.ok) {
          var dup = w.motos.some(function(o, j){ return o !== m && normalizeVin(o.vin) === r.vin; });
          if (dup) m.check = { ok:false, reason:'duplicate', vin: r.vin };
          else if (r.locked) m.check = { ok:false, reason: r.locked.closed ? 'closed' : 'locked', vin: r.vin };
          else if (m.achatDate && m.achatDate > todayISO()) m.check = { ok:false, reason:'date_future', vin: r.vin };
          else m.check = { ok:true, vin: r.vin, container: r.container };
        } else m.check = r;
        w.formError = '';
        render();
      }).catch(function(e){ w.formError = serverErrorMsg(e); render(); });
    }
    else if (action === 'submit-particulier') {
      var errP = validateParticulierDocs(w);
      if (!w.vinResult || !w.ticket || errP.length || w.country !== 'fr') { w.step = 4; w.formError = errP.length ? missingMsg(errP) : 'Dossier incomplet.'; render(); return; }
      busy(Store.submitParticulier(w).then(function(r){
        if (r.ok) { w.ticket = r.ticket; state.view = 'confirmation-particulier'; render(); return; }
        if (r.reason === 'locked') { w.step = 2; w.error = 'Un autre dossier a été ouvert pour ce numéro de série entre-temps. Merci de nous contacter.'; w.errorException = null; }
        else if (r.reason === 'ticket_invalid') { w.ticket = null; w.token = null; w.vinResult = null; w.step = 2; w.errorException = null; w.error = 'Votre dossier a expiré. Merci de vérifier à nouveau votre numéro de série.'; }
        else if (r.reason === 'reg_date') { w.step = 1; w.formError = 'Date d\'immatriculation non éligible.'; }
        else if (r.reason === 'storage') { w.step = 4; w.formError = 'Impossible d\'enregistrer le dossier : l\'espace de stockage du navigateur est plein. Merci de compresser vos pièces jointes.'; }
        else { w.step = 4; w.formError = r.reason === 'docs' ? 'Les pièces jointes n\'ont pas pu être enregistrées. Merci de les joindre à nouveau.' : 'Dossier incomplet.'; }
        render();
      }).catch(function(e){
        w.step = 4;
        w.formError = e && e.code === 'server' && /mime|size|large|payload/i.test(e.message) ? 'Une pièce jointe a été refusée (format ou taille). Merci de joindre une photo ou un PDF de moins de 8 Mo.' : serverErrorMsg(e);
        render();
      }));
    }
    else if (action === 'submit-pro') {
      if (!allMotosOk(w)) { w.step = 2; render(); return; }
      var missPro = validateProCoords(w.proCoords);
      if (missPro.length) { w.step = 3; w.formError = missingMsg(missPro); render(); return; }
      busy(Store.submitPro(w).then(function(r){
        if (r.ok) { w.ticket = r.ticket; state.view = 'confirmation-pro'; render(); return; }
        if (r.reason === 'locked') {
          var taken = r.taken || [];
          w.motos.forEach(function(m){ if (taken.indexOf(m.check.vin) >= 0) m.check = { ok:false, reason:'locked', vin: m.check.vin }; });
          w.step = 2;
          w.formError = taken.length ? 'Un dossier a été ouvert entre-temps pour ' + taken.length + ' de ces motos. Retirez-les pour continuer.' : 'Un dossier a été ouvert entre-temps pour une de ces motos. Vérifiez à nouveau chaque numéro de série.';
        }
        else if (r.reason === 'storage') w.formError = 'Impossible d\'enregistrer le dossier (espace de stockage du navigateur plein).';
        else if (r.reason === 'incomplete') { w.step = 3; w.formError = 'Coordonnées incomplètes : vérifiez la raison sociale, le SIRET, le téléphone et l\'email.'; }
        else { w.step = 2; w.formError = 'Une des motos n\'est pas éligible' + (r.vin ? ' (' + r.vin + ')' : '') + ' : vérifiez à nouveau chaque ligne.'; }
        render();
      }).catch(function(e){ w.formError = serverErrorMsg(e); render(); }));
    }

    else if (action === 'track-lookup') {
      var tr0 = state.track;
      if (!tr0.contact.trim()) { tr0.error = 'Merci d\'indiquer l\'email ou le téléphone utilisé lors de la demande.'; tr0.result = null; render(); return; }
      busy(Store.track(tr0.ticketId, tr0.contact).then(function(tk){
        // Même message dans les deux cas : on ne révèle pas si un numéro de dossier existe.
        if (!tk) { tr0.error = 'Aucun dossier ne correspond à ce numéro et à ce contact.'; tr0.result = null; render(); return; }
        tr0.error = ''; tr0.result = tk; render();
      }).catch(function(e){ tr0.error = serverErrorMsg(e); tr0.result = null; render(); }));
    }
    else if (action === 'track-reset') { state.track = initTrack(); render(); }
    else if (action === 'track-resubmit') {
      var up = state.track.reupload;
      if (!up.carteGrise && !up.facture) { state.track.reuploadError = 'Merci de joindre au moins un nouveau document avant de renvoyer.'; render(); return; }
      var tr1 = state.track;
      busy(Store.resubmit(tr1.result, tr1.contact, up).then(function(r){
        if (r.reason === 'status') { tr1.result = r.ticket; render(); return; }
        if (!r.ok) { tr1.reuploadError = r.reason === 'storage' ? 'Impossible d\'enregistrer les documents (espace de stockage plein).' : 'Les documents n\'ont pas pu être enregistrés. Merci de réessayer.'; render(); return; }
        tr1.result = r.ticket;
        tr1.reupload = {}; tr1.reuploadError = '';
        render();
      }).catch(function(e){ tr1.reuploadError = serverErrorMsg(e); render(); }));
    }

    else if (action === 'admin-login') {
      var a0 = state.admin;
      busy(Store.adminLogin(a0).then(function(r){
        if (r.ok) { a0.authed = true; a0.passError = ''; a0.passInput = ''; a0.cap = r.cap; return Store.adminRefresh(null); }
        a0.passError = r.error;
      }).catch(function(e){ a0.passError = serverErrorMsg(e); }).then(render));
    }
    else if (action === 'admin-open' || el.closest('tr[data-action="admin-open"]')) {
      var trEl = el.closest('tr[data-action="admin-open"]');
      if (trEl) {
        state.admin.selected = trEl.dataset.id; state.admin.fraudCheck = false; state.admin.ecartMotif = ''; state.admin.actionError = '';
        render();
        adminReload();
      }
    }
    else if (action === 'admin-filter') { state.admin.filter = el.dataset.value; render(); }
    else if (action === 'admin-back') { state.admin.selected = null; state.admin.actionError = ''; render(); adminReload(); }
    else if (/^admin-(validate|reject-doc|grant-exception|close-nosuite)$/.test(action)) {
      if (!state.admin.authed) return;
      var id5 = el.dataset.id, t = Store.adminTicket(id5), opts = {}, cap = state.admin.cap;
      if (!t || isClosed(t)) { render(); return; }
      state.admin.actionError = '';
      if (action === 'admin-validate') {
        if (!state.admin.fraudCheck) { state.admin.actionError = 'Renseignez le contrôle de concordance avant de valider.'; render(); return; }
        if (state.admin.fraudCheck === 'ecart') {
          var motif = String(state.admin.ecartMotif || '').trim();
          if (!motif) { state.admin.actionError = 'Indiquez le motif de l\'écart et le justificatif fourni avant de valider.'; render(); return; }
          opts.reason = 'Écart justifié : ' + motif;
        }
      }
      else if (action === 'admin-reject-doc') {
        var reason = prompt('Motif du rejet (ex: photo illisible, document incomplet) :');
        if (reason === null) return;
        if (!reason.trim()) { state.admin.actionError = 'Un motif de rejet est obligatoire.'; render(); return; }
        opts.reason = reason.trim();
      }
      else if (action === 'admin-grant-exception') {
        if (t.status !== 'exception_manuelle') return;
        var montant = prompt('Montant de l\'avoir accordé (€' + (cap ? ', plafond interne indicatif ' + cap + ' € HT' : '') + ') :');
        if (montant === null) return;
        var val = parseFloat(String(montant).replace(',', '.').replace(/[^\d.\-]/g, ''));
        if (isNaN(val) || val <= 0) { state.admin.actionError = 'Montant invalide : saisissez un nombre positif.'; render(); return; }
        if (cap && val > cap && !confirm('Ce montant dépasse le plafond interne indicatif de ' + cap + ' € HT. Confirmer ?')) return;
        opts.amount = Math.round(val * 100) / 100;
      }
      var apiAction = { 'admin-validate':'validate', 'admin-reject-doc':'reject_doc', 'admin-grant-exception':'grant_exception', 'admin-close-nosuite':'close_nosuite' }[action];
      busy(Store.adminAction(id5, apiAction, opts).then(function(r){
        if (r && !r.ok && r.reason === 'stale') state.admin.actionError = 'Ce dossier a été modifié entre-temps (par exemple, nouveaux documents du client). Vérifiez la fiche mise à jour avant d\'agir.';
      }).catch(adminError).then(render));
    }
  }

  render();
})();
</script>
</body>
</html>
